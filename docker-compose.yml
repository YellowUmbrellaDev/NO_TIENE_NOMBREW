version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: modpack-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: modpack-ddns
    restart: unless-stopped
    # Configurar CF_API_TOKEN en el archivo .env
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
      - DOMAINS=modpack.nameless.yellowumbrella.dev
      - PROXIED=false
    security_opt:
      - no-new-privileges:true

  webhook:
    build: ./webhook
    container_name: modpack-webhook
    restart: unless-stopped
    volumes:
      - ./:/srv:rw
      - /var/run/docker.sock:/var/run/docker.sock
    # Configurar WEBHOOK_SECRET en el archivo .env
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}

volumes:
  caddy_data:
  caddy_config:
