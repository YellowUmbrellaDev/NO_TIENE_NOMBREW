name: Deploy Modpack to Server

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook
        run: |
          curl -X POST -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET }}" \
          -f -k https://modpack.nameless.yellowumbrella.dev/hooks/deploy
